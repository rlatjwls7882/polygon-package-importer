name: Test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python tests/run.py
      - name: Validate Store listing text
        run: python scripts/check_listing.py
      - name: Build Chrome Web Store package
        run: |
          python scripts/build_release.py
          python scripts/check_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-web-store-package
          path: dist/*.zip
          if-no-files-found: error
